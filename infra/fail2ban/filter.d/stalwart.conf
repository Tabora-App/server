# Stalwart 1.x, трассировка Stdout в journald (stalwart/configure.py):
#   … INFO Authentication failed (auth.failed) listenerId = "imaps", …, accountName = "x@…", reason = "…", remoteIp = 203.0.113.5
#   … INFO Unauthorized IP address (security.ip-unauthorized) accountId = 1, reason = "…", remoteIp = 203.0.113.5, id = "a1"
#   … INFO Banned due to authentication errors (security.authentication-ban) …, remoteIp = 203.0.113.5, accountName = "…"
# Имя учётки и другие строки в кавычках задаёт клиент (Stalwart экранирует в них кавычку и перевод
# строки). Поэтому событие ищется только до первой кавычки, а remoteIp — только вне кавычек:
# подставить чужой адрес через имя учётки («x remoteIp = 198.51.100.1, ») нельзя.
# События HTTP-слушателя (JMAP через nginx) не считаются: их считает тюрьма tabora-jmap по журналу
# nginx, иначе одна серия ошибок давала бы два бана и раньше времени доводила до recidive.
[Definition]
failregex = ^[^"]*\((?:auth\.failed|auth\.too-many-attempts|security\.ip-unauthorized|security\.authentication-ban)\) (?:[^"]|"(?:[^"\\]|\\.)*")*?\bremoteIp = (?:::ffff:)?<ADDR>(?:,|\s|$)
ignoreregex = ^[^"]*\([a-z.-]+\) listenerId = "http"
