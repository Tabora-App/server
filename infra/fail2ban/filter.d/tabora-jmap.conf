# nginx, журнал почтового хоста /var/log/nginx/mx.access.log (формат tabora_mx, infra/nginx/http.conf):
#   203.0.113.5 - - [09/Nov/2026:20:43:45 +0000] "POST /jmap/ HTTP/2.0" 401 0 "-" "agent" auth=1
# Считаются только 401/403 на запрос с заголовком Authorization (auth=1). Имя пользователя в журнал
# не пишется, кавычки в запросе и User-Agent nginx экранирует, поэтому строку нельзя подделать.
[Definition]
failregex = ^<ADDR> - - \[[^\]]*\] "[A-Z]+ /(?:jmap|\.well-known/jmap)[^" ]* HTTP/[0-9.]+" (?:401|403) \d+ "[^"]*" "[^"]*" auth=1$
ignoreregex =
