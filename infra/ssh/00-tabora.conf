# Tabora: только вход по ключу (файл читается раньше 50-cloud-init.conf, действует первое значение)
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
# проброс портов только к панели администратора Stalwart: ssh -L 8080:127.0.0.1:8080 tabora
AllowTcpForwarding local
PermitOpen 127.0.0.1:8080
PermitUserEnvironment no
