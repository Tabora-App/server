# Общие настройки nginx для Tabora (/etc/nginx/conf.d/tabora.conf)
server_tokens off;

# WebSocket (/jmap/ws): Upgrade передаётся дальше, остальным запросам Connection не нужен
map $http_upgrade $tabora_connection {
    default upgrade;
    ""      "";
}

# Логины с правами администратора Stalwart (имя из Basic-auth, $remote_user). Снаружи они запрещены
# (почтовый хост отвечает 403); сам Stalwart тоже пускает их только с 127.0.0.1 (allowedIps).
# Список пишет infra/stalwart/configure.py.
map $remote_user $tabora_privileged_login {
    default 0;
    include /etc/nginx/tabora-privileged-logins.map;
}

# Журнал почтового хоста: формат combined без имени пользователя и с признаком «в запросе был
# заголовок Authorization» (сам заголовок не пишется). По нему fail2ban (tabora-jmap) отличает
# попытку входа от обычного первого запроса без авторизации.
map $http_authorization $tabora_has_auth {
    default 1;
    ""      0;
}
log_format tabora_mx '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" auth=$tabora_has_auth';
