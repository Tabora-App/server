# Сайт tabora.app: доступ только через Cloudflare Tunnel (cloudflared → 127.0.0.1:8081, без TLS:
# шифрование до Cloudflare делает туннель). Работает и до выпуска сертификатов.

# Язык для адреса «/»: первый язык из Accept-Language. Свои страницы есть у русского, украинского
# и испанского (ru-RU, uk, es-419…); всем остальным и тем, кто язык не назвал, — английская.
map $http_accept_language $tabora_site_lang {
    default en;
    "~*^\s*ru(?:[-_,;\s]|$)" ru;
    "~*^\s*uk(?:[-_,;\s]|$)" uk;
    "~*^\s*es(?:[-_,;\s]|$)" es;
}

# www ведёт на основное имя: один адрес у сайта, а не две копии
server {
    listen 127.0.0.1:8081;
    server_name www.__DOMAIN__;
    include snippets/tabora-site-headers.conf;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 127.0.0.1:8081;
    server_name __DOMAIN__;
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;
    include snippets/tabora-site-headers.conf;
    root /var/www/tabora.app;
    index index.html;
    # nginx слушает 127.0.0.1:8081 за туннелем: в полном адресе перенаправления оказались бы http и этот
    # порт. С относительным Location работают и «/» → /<язык>/, и /en → /en/
    absolute_redirect off;
    # Страницы лежат по языкам: /ru/, /en/, /uk/, /es/ (их отдаёт location / ниже, с теми же заголовками,
    # что были у главной). «/» ведёт на язык посетителя; ответ зависит от Accept-Language, поэтому
    # не кешируется ни браузером, ни Cloudflare. Если перенаправления нет (сайт выложен раньше этой
    # конфигурации), по «/» отдаётся index.html — копия английской страницы.
    location = / {
        include snippets/tabora-site-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept-Language" always;
        return 302 /$tabora_site_lang/$is_args$args;
    }
    location /downloads/ {
        alias /var/www/downloads/;
        include snippets/tabora-site-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }
    # Short screen recordings for app store reviewers (/downloads/*.mp4) are given out as links and open
    # straight in a browser tab: the page the browser builds around such a file may play it, nothing else.
    location ~ ^/downloads/[A-Za-z0-9._-]+\.mp4$ {
        root /var/www;
        include snippets/tabora-security.conf;
        add_header Content-Security-Policy "default-src 'none'; media-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=3600";
    }
    location /assets/ {
        expires 30d;
        include snippets/tabora-site-headers.conf;
        add_header Cache-Control "public, immutable";
    }
    # точки входа без хеша в имени: браузер и Cloudflare каждый раз перепроверяют их, иначе правка сайта
    # дойдёт не сразу (всё в /assets/js/ названо по хешу и кешируется надолго)
    location ~ ^/site\.(css|js)$ {
        include snippets/tabora-site-headers.conf;
        add_header Cache-Control "no-cache";
    }
    # Каталог открытых ключей почты (Web Key Directory, прямой способ): по нему почтовые программы
    # находят ключ адреса @__DOMAIN__. Отвечает сервер аккаунтов; поддомена openpgpkey в DNS нет
    # намеренно — иначе программы пошли бы туда и на этот адрес не вернулись.
    location /.well-known/openpgpkey/ {
        proxy_pass http://127.0.0.1:7700;
        include snippets/tabora-proxy.conf;
        include snippets/tabora-site-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
    }
    # несуществующий адрес — 404, а не главная страница с кодом 200
    location / { try_files $uri $uri/ =404; }
}
