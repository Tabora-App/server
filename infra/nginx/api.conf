# API аккаунтов и синхронизации: только через Cloudflare Tunnel (cloudflared → 127.0.0.1:8081)
server {
    listen 127.0.0.1:8081;
    server_name __API_HOST__;
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;
    include snippets/tabora-security.conf;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    client_max_body_size 32m;
    location / { proxy_pass http://127.0.0.1:7700; include snippets/tabora-proxy.conf; }
}
