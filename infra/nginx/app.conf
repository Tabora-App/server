# Веб-версия Tabora: https://app.__DOMAIN__. Приложение (статика из /var/www/app.__DOMAIN__, сборка
# tools/web/build.mjs) и сервер аккаунтов на одном имени: странице не нужны запросы на чужие адреса,
# и политика содержимого их запрещает.
#
# Имя обслуживается напрямую, без Cloudflare Tunnel: через него шли бы и сами скрипты, которые
# расшифровывают данные в браузере, и открытый текст писем. Сертификат — Let's Encrypt (DNS-01),
# выпускает infra/enable-tls.sh; пока его нет, это имя не включается (lib.sh: install_nginx).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.__DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/app.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.__DOMAIN__/privkey.pem;

    root /var/www/app.__DOMAIN__;
    access_log /var/log/nginx/app.access.log tabora_mx;
    # вложения писем и обращений загружаются через сервер аккаунтов (до 52 МиБ, src/webmail.rs)
    client_max_body_size 56m;

    # сервер аккаунтов: вход, синхронизация, поддержка, почта веб-версии (/v1/mail/jmap…)
    location /v1/ {
        proxy_pass http://127.0.0.1:7700;
        include snippets/tabora-proxy.conf;
        include snippets/tabora-security.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        proxy_hide_header WWW-Authenticate;
        proxy_request_buffering off;
    }

    # каталог открытых ключей адресов Tabora: приложение ищет в нём ключи получателей
    location /.well-known/openpgpkey/ {
        proxy_pass http://127.0.0.1:7700;
        include snippets/tabora-proxy.conf;
        include snippets/tabora-security.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # файлы сборки с хешем в имени не меняются никогда
    location /assets/ {
        include snippets/tabora-app-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /frame/mail.html {
        include snippets/tabora-app-frame-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /frame/mail-remote.html {
        include snippets/tabora-app-frame-remote-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # описание для установки на экран телефона: у nginx нет своего типа для .webmanifest, а с
    # запретом угадывать тип (nosniff) браузер файл без верного типа не примет
    location ~ ^/manifest(-[a-z][a-z])?\.webmanifest$ {
        include snippets/tabora-app-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
    }

    # страница приложения и остальная статика (значки, описание для установки на экран): без кэша,
    # чтобы новая сборка подхватывалась сразу. Адреса разделов живут после # и сюда не приходят.
    location / {
        include snippets/tabora-app-headers.conf;
        add_header Cache-Control "no-cache" always;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
