# The support site: https://support.__DOMAIN__. Static files from /var/www/support.__DOMAIN__ (built
# by tools/web/build-support.mjs in the browser repository) and, on the same name, the part of the
# account server the site needs: the sign-in and the support requests. Nothing else of the account
# server is reachable through this name, and the session the site gets is good for nothing else
# either (src/api.rs: auth_for).
#
# Served directly, without Cloudflare Tunnel, like the web app: the scripts of this page turn a
# password into a login hash, and the conversations are private. The certificate is Let's Encrypt
# (DNS-01), issued by infra/enable-tls.sh; until it exists this name is not enabled (lib.sh:
# install_nginx).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name support.__DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/support.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.__DOMAIN__/privkey.pem;

    root /var/www/support.__DOMAIN__;
    access_log /var/log/nginx/support.access.log tabora_mx;
    # attachments of a request: four files of 2 MiB in Base64 and the text (src/support.rs)
    client_max_body_size 13m;

    # the account server: only the sign-in and the support requests
    location ~ ^/v1/(support/|account/(prelogin|login|logout)$|health$) {
        proxy_pass http://127.0.0.1:7700;
        include snippets/tabora-proxy.conf;
        include snippets/tabora-security.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        proxy_hide_header WWW-Authenticate;
        proxy_request_buffering off;
    }

    location /v1/ {
        include snippets/tabora-security.conf;
        default_type application/json;
        return 404 '{"code":"not-found","message":"Not found"}';
    }

    # build files with a hash in the name never change
    location /assets/ {
        include snippets/tabora-app-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # the page and the rest of the static files: no caching, so that a new build is picked up at
    # once. The addresses of screens and the key of a request's link live after # and never come here.
    location / {
        include snippets/tabora-app-headers.conf;
        add_header Cache-Control "no-cache" always;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
