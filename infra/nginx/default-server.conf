# Запросы на голый IP и с чужим Host не получают ничего: на 443 TLS-рукопожатие отклоняется
# (сертификат не нужен и не показывается), на 8081 соединение закрывается без ответа.
# Порт 80 не слушается: сертификаты выпускаются через DNS-01, сайт и API идут через туннель.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 127.0.0.1:8081 default_server;
    server_name _;
    return 444;
}
